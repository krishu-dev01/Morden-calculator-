<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <div class="calculator">
    <div class="inout">
      <div class="displayoutput">
    <input id="display1" type="text" class="display" disabled>
    <button class="backspace btn"
    >⌫</button>
    </div>
        <input id="display2" type="text" disabled class="display">
        </div>

    
    <div class="buttons">
      <div>
    <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn oprator"> + </button> </div>
      <div>
      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn oprator"> - </button> </div>
      <div>
      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn oprator">×</button> </div>
      <div>
      <button class="btn clear">C</button>
      <button class="btn ">0</button>
      <button class="btn oprator">=</button>
      <button class="btn oprator">÷</button>
      </div>
    </div>
    
    
  </div>
  <script src="script.js">
  </script>
</body>

</html>
